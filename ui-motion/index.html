<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Workshop UI Motion</title>
<style>
/* Black, white and one accent. Every pixel is a function of t: no CSS transitions, no timers, no will-change on scaled layers. */
:root { --ink: #0b0b0b; --bg: #ffffff; --accent: #D97757; --f: "Inter Display", "Inter", system-ui, sans-serif; --m: "DejaVu Sans Mono", "Liberation Mono", monospace; }
html, body { margin: 0; background: var(--bg); }
#stage { position: relative; width: 1440px; height: 1440px; overflow: hidden; background: var(--bg); color: var(--ink); font-family: var(--f); }
#cam { position: absolute; left: 0; top: 0; width: 1440px; height: 1440px; transform-origin: 0 0; }
.tag { position: absolute; left: 0; top: 90px; width: 1440px; text-align: center; font: 600 54px/70px var(--f); letter-spacing: -0.025em; }
.tag .dim { color: rgba(11, 11, 11, .42); }
.win { position: absolute; left: 120px; top: 250px; width: 1200px; height: 940px; box-sizing: border-box; border: 3px solid var(--ink); border-radius: 36px; background: var(--bg); overflow: hidden; }
.logo { position: absolute; left: 40px; top: 52px; width: 40px; height: 40px; border-radius: 10px; background: var(--accent); }
.word { position: absolute; left: 100px; top: 38px; font: 600 52px/68px var(--f); letter-spacing: -0.02em; }
.btn { position: absolute; top: 36px; height: 68px; border-radius: 34px; background: var(--ink); color: #fff; font: 500 28px/68px var(--f); text-align: center; white-space: nowrap; overflow: hidden; }
.btn .lbl { position: absolute; inset: 0; }
.btn svg { position: absolute; left: 50%; top: 50%; width: 44px; height: 44px; margin: -22px 0 0 -22px; overflow: visible; }
.cap { position: absolute; left: 40px; font: 500 18px/1 var(--m); letter-spacing: 0.14em; text-transform: uppercase; opacity: .5; white-space: nowrap; }
.row { position: absolute; left: 40px; width: 1116px; height: 112px; box-sizing: border-box; border: 3px solid var(--ink); border-radius: 24px; background: var(--bg); overflow: hidden; }
.row .dot { position: absolute; left: 32px; top: 36px; width: 28px; height: 28px; box-sizing: border-box; border-radius: 50%; border: 3px solid var(--ink); }
.row .dot.on { background: var(--accent); }
.row .dot.dash { border-style: dashed; }
.row .nm { position: absolute; left: 92px; top: 16px; font: 600 40px/48px var(--f); letter-spacing: -0.015em; white-space: nowrap; }
.row .st { position: absolute; left: 92px; top: 68px; font: 500 18px/24px var(--m); letter-spacing: 0.08em; text-transform: uppercase; opacity: .62; white-space: nowrap; }
.row .st.sw { width: 520px; height: 24px; overflow: hidden; }
.strip > div { height: 24px; line-height: 24px; }
.row .bar { position: absolute; right: 120px; top: 48px; width: 220px; height: 12px; border-radius: 6px; background: rgba(11, 11, 11, .12); overflow: hidden; }
.row .bar i { position: absolute; inset: 0 auto 0 0; background: var(--ink); border-radius: 6px; }
.row .bang { position: absolute; right: 28px; top: 26px; width: 52px; height: 52px; border-radius: 50%; background: var(--ink); color: #fff; font: 700 32px/52px var(--f); text-align: center; }
.hd { position: absolute; left: 0; top: 0; right: 0; height: 106px; }
.foot { position: absolute; left: 40px; top: 890px; width: 760px; height: 24px; overflow: hidden; font: 500 20px/24px var(--m); letter-spacing: 0.08em; text-transform: uppercase; opacity: .6; white-space: nowrap; }
.foot .strip > div { height: 24px; line-height: 24px; }
.panel { position: absolute; left: 640px; top: 0; bottom: 0; width: 560px; background: var(--bg); border-left: 3px solid var(--ink); }
.panel h2 { position: absolute; left: 40px; top: 36px; margin: 0; font: 600 44px/68px var(--f); letter-spacing: -0.02em; white-space: nowrap; }
.x { position: absolute; left: 456px; top: 36px; width: 64px; height: 64px; border-radius: 50%; border: 3px solid var(--ink); box-sizing: border-box; }
.x::before, .x::after { content: ""; position: absolute; left: 14px; top: 27px; width: 30px; height: 3px; background: var(--ink); transform: rotate(45deg); }
.x::after { transform: rotate(-45deg); }
.chip { position: absolute; top: 170px; height: 64px; box-sizing: border-box; border: 3px solid var(--ink); border-radius: 32px; font: 500 26px/58px var(--f); text-align: center; background: var(--bg); }
.field { position: absolute; left: 40px; top: 330px; width: 480px; height: 150px; box-sizing: border-box; border: 3px solid var(--ink); border-radius: 20px; padding: 22px 24px; font: 500 32px/40px var(--f); }
.caret { display: inline-block; width: 3px; height: 34px; background: var(--ink); vertical-align: -6px; margin-left: 2px; }
/* detail card: the Outreach row grows into this, everything inside is laid out at its final size and revealed by the clip */
.b { position: absolute; width: 96px; border-radius: 14px 14px 0 0; background: var(--ink); }
.dl { position: absolute; width: 96px; text-align: center; font: 500 18px/1 var(--m); letter-spacing: 0.1em; text-transform: uppercase; opacity: .5; }
.base { position: absolute; left: 32px; top: 440px; width: 1052px; height: 3px; background: var(--ink); }
.tt { position: absolute; height: 56px; padding: 0 24px; border-radius: 28px; background: var(--ink); color: #fff; font: 500 24px/56px var(--f); white-space: nowrap; transform-origin: 50% 100%; }
.lab { position: absolute; left: 32px; font: 500 30px/52px var(--f); letter-spacing: -0.01em; }
.trk { position: absolute; left: 330px; top: 556px; width: 500px; height: 12px; border-radius: 6px; background: rgba(11, 11, 11, .12); }
.fill { position: absolute; left: 330px; top: 556px; height: 12px; border-radius: 6px; background: var(--ink); }
.knob { position: absolute; top: 540px; width: 44px; height: 44px; box-sizing: border-box; border-radius: 50%; border: 3px solid var(--ink); background: #fff; }
.val { position: absolute; left: 860px; top: 540px; font: 500 28px/44px var(--m); letter-spacing: 0.06em; }
.tgl { position: absolute; left: 330px; top: 650px; width: 96px; height: 52px; box-sizing: border-box; border: 3px solid var(--ink); border-radius: 26px; }
.tgl i { position: absolute; top: 4px; width: 38px; height: 38px; border-radius: 50%; background: var(--ink); }
#cur { position: absolute; left: 0; top: 0; width: 56px; height: 56px; transform-origin: 6px 4px; pointer-events: none; overflow: visible; }
</style>
<script src="beats.js"></script>
</head>
<body>
<div id="stage">
  <div id="cam">
    <div class="tag">Your agents. <span class="dim">Working, or not.</span></div>
    <div class="win" id="win">
      <div class="logo"></div><div class="word">Workshop</div>
      <div class="btn" id="btn"><div class="lbl" id="lbl">Connect agent</div>
        <svg id="ldr" viewBox="0 0 44 44"><circle id="ring" cx="22" cy="22" r="17" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-dasharray="80 26.8"/><path id="chk" d="M12 23l7 7 14-15" fill="none" stroke="#0b0b0b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="40" stroke-dashoffset="40"/></svg>
      </div>
      <div class="cap" style="top:150px">Agents</div>
      <div id="rows"></div>
      <div class="foot"><div class="strip" id="foot"><div>3 agents · 1 working</div><div>4 agents · 1 working</div><div>4 agents · 1 working · 1 needs you</div></div></div>
      <div class="panel" id="panel">
        <h2>Outreach agent</h2><div class="x" id="xbtn"></div>
        <div class="cap" style="top:130px">Status</div>
        <div class="chip" style="left:40px;width:150px">Working</div>
        <div class="chip" id="chipN" style="left:204px;width:180px">Needs me</div>
        <div class="chip" style="left:398px;width:110px">Idle</div>
        <div class="cap" style="top:290px">Note</div>
        <div class="field" id="note"></div>
      </div>
    </div>
  </div>
  <svg id="cur" viewBox="0 0 56 56"><path d="M6 4 L6 40 L15 31 L21 46 L28 43 L22 29 L34 29 Z" fill="#0b0b0b" stroke="#fff" stroke-width="3" stroke-linejoin="round"/></svg>
</div>
<script>
'use strict';
/* ================= time base: the beat grid measured from track.wav (tools/audio.py) ================= */
const BEATS = window.BEATS || Array.from({ length: 16 }, (_, i) => i * 0.5);
const LOOP = window.LOOP || 8;                                  // 120 BPM, 16 beats, 8 s, 480 frames at 60 fps
const T = (b, q = 0) => {                                       // beat b (1..16) plus q sixteenth-beats: every action is snapped here
  const i = b - 1, t0 = BEATS[i], t1 = i < 15 ? BEATS[i + 1] : LOOP;
  return t0 + q * (t1 - t0) / 4;
};

/* ================= closed-form springs, summed when a target changes mid-flight ================= */
function springStep(zeta, w) {                                  // unit step response of x'' + 2 zeta w x' + w^2 x = w^2 target
  if (zeta >= 1) return tau => tau <= 0 ? 0 : 1 - Math.exp(-w * tau) * (1 + w * tau);
  const wd = w * Math.sqrt(1 - zeta * zeta), k = zeta * w / wd;
  return tau => tau <= 0 ? 0 : 1 - Math.exp(-zeta * w * tau) * (Math.cos(wd * tau) + k * Math.sin(wd * tau));
}
const UI = springStep(0.75, 15.5);                              // UI: damping 0.75, 2% settle in about 0.35 s, 2.8% overshoot
const CURX = springStep(0.8, 17), CURY = springStep(0.8, 15);   // cursor: x and y a touch apart so diagonal moves arc like a hand
const CAM = springStep(1.0, 12);                                // camera: damping 1.0, no overshoot
/* A spring never quite arrives. Between 0.6 s and 0.85 s after a step the (already tiny) remainder is eased to exactly zero,
   so a settled channel is exactly its target and the last frame equals the first frame, cursor included.
   Nothing steps after T(15,1) = 7.125 s, so every channel is exact by 7.975 s. */
const SNAP0 = 0.6, SNAP1 = 0.85;
const sstep = x => x <= 0 ? 0 : x >= 1 ? 1 : x * x * (3 - 2 * x);
function chan(S, init, steps) {                                 // steps: [[time, target], ...] ascending
  return t => {
    let v = init, prev = init;
    for (const [ts, tg] of steps) {
      const tau = t - ts;
      const k = tau <= 0 ? 0 : tau >= SNAP1 ? 1 : 1 - (1 - S(tau)) * (1 - sstep((tau - SNAP0) / (SNAP1 - SNAP0)));
      v += (tg - prev) * k; prev = tg;
    }
    /* once the last step is fully settled return its target bit-for-bit: summing the deltas leaves ~1e-16 of float dust
       (a camera scale of 0.9999999999999996), and Chrome stops pixel-snapping the window border at a scale that is not exactly 1 */
    if (steps.length && t - steps[steps.length - 1][0] >= SNAP1) return prev;
    return v;
  };
}
const pulse = (S, t0, t1) => chan(S, 0, [[t0, 1], [t1, 0]]);

/* ================= geometry (world = canvas px at camera scale 1) ================= */
const WIN = { x: 120, y: 250 };
const slotTop = i => 190 + 128 * i;                             // window-relative top of list slot i
const CARD = { x: WIN.x + 40 + 3, y: WIN.y + 140 + 3 };         // expanded detail card, padding-box origin in world px
const BAR = { x0: 60, pitch: 150, base: 440, max: 220 };
const VAL = [0.38, 0.62, 0.48, 0.86, 0.55, 0.74, 0.66], DAY = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
const barX = i => CARD.x + BAR.x0 + 48 + BAR.pitch * i;         // world x of bar i's centre
const barTop = i => CARD.y + BAR.base - BAR.max * VAL[i];       // world y of bar i's top
const TRK = { x: 330, w: 500, y: 562 };                         // slider track, card-relative
const knobWorldX = p => CARD.x + TRK.x + TRK.w * p;
const P0 = 0.8, P1 = 0.2;

/* ================= the beat map: one action per beat ================= */
/*  1-2  hold the hero                                  9  click "Needs me": row turns accent, "!" pops
    3    cursor to Connect, camera in                  10  close panel, list re-orders, needs-you row to the top
    4    click: button morphs into a loader            11  click the row: it grows into a detail card, bars rise
    5    loader closes into a check                    12  cursor sweeps the bars, tooltip follows
    6    Outreach row slides in, camera to the list    13  drag the slider
    7    click the row: panel opens                    14  toggle Notify
    8    note types                                    15  Done: card collapses, row leaves, camera pulls back
    16   settle: last frame is the first frame */
const CAMKEYS = [                                               // [time, centre x, centre y, scale]; every key keeps the tagline out of frame
  [T(3),     1050, 595, 1.7],
  [T(6),      720, 780, 1.25],
  [T(7),     1050, 670, 1.45],
  [T(10),     720, 800, 1.15],
  [T(11),     720, 760, 1.25],
  [T(12, 2),  720, 940, 1.25],
  [T(15),     720, 720, 1]
];
const camX = chan(CAM, 720, CAMKEYS.map(k => [k[0], k[1]]));
const camY = chan(CAM, 720, CAMKEYS.map(k => [k[0], k[2]]));
const camS = chan(CAM, 1, CAMKEYS.map(k => [k[0], k[3]]));

const REST = [600, 330], BTN = [1150, 322], ROW_LO = [720, 880], CHIP = [1054, 452], CLOSE = [1272, 318], ROW_HI = [700, 496];
const CURPATH = [                                               // [time, x, y]: depart a half-beat before the beat it has to land on
  [T(3),     BTN[0], BTN[1]],
  [T(6, 1),  ROW_LO[0], ROW_LO[1]],
  [T(7, 2),  CHIP[0], CHIP[1]],
  [T(9, 2),  CLOSE[0], CLOSE[1]],
  [T(10, 1), ROW_HI[0], ROW_HI[1]],
  [T(11, 1), barX(2), 800],
  [T(12, 1), barX(4), 790],
  [T(12, 2), knobWorldX(P0), CARD.y + TRK.y],
  [T(13),    knobWorldX(P1), CARD.y + TRK.y],
  [T(13, 2), CARD.x + 330 + 48, CARD.y + 676],
  [T(14, 2), CARD.x + 896 + 90, CARD.y + 674],
  [T(15, 1), REST[0], REST[1]]
];
const curX = chan(CURX, REST[0], CURPATH.map(p => [p[0], p[1]]));
const curY = chan(CURY, REST[1], CURPATH.map(p => [p[0], p[2]]));
const clickAt = [T(4), T(7), T(9), T(10), T(11), T(13), T(14), T(15)];   // keep in step with CLICK_BEATS in tools/audio.py
const press = chan(UI, 0, clickAt.flatMap(c => [[c, 1], [c === T(13) ? T(13, 2) : c + 0.125, 0]]));
const hover = pulse(UI, T(3, 2), T(6));                          // Connect: hovered once the cursor lands
const btnPress = pulse(UI, T(4), T(4, 1));
const morph = pulse(UI, T(4), T(6));                             // pill to ring and back
const check = pulse(UI, T(5), T(6));                             // ring closes, check draws
const dRise = chan(UI, 0, [[T(6), 1]]);                          // Outreach row rises into slot 3
const dExit = chan(UI, 0, [[T(15, 1), 1]]);                      // and leaves to the right at the end
const needs = chan(UI, 0, [[T(9), 1]]);
const f1 = pulse(UI, T(6), T(15, 1)), f2 = pulse(UI, T(9), T(15, 1));
const chipPress = pulse(UI, T(9), T(9, 1));
const closePress = pulse(UI, T(10), T(10, 1));
const rowPress = chan(UI, 0, [[T(7), 1], [T(7, 1), 0], [T(11), 1], [T(11, 1), 0]]);
const panelOpen = pulse(UI, T(7), T(10));
const expand = pulse(UI, T(11), T(15));
const slot = {                                                   // list slot of each row: Outreach jumps to the top at beat 10
  A: chan(UI, 0, [[T(10), 1], [T(15, 1), 0]]),
  B: chan(UI, 1, [[T(10), 2], [T(15, 1), 1]]),
  C: chan(UI, 2, [[T(10), 3], [T(15, 1), 2]]),
  D: chan(UI, 3, [[T(10), 0]])
};
const barR = VAL.map((_, i) => chan(UI, 0, [[T(11, 2 + i * 0.25), 1]]));
const barHot = [];
barHot[2] = pulse(UI, T(12), T(12, 1));
barHot[4] = pulse(UI, T(12, 1), T(12, 2));
const ttShow = pulse(UI, T(12), T(12, 2));
const ttX = chan(UI, barX(2), [[T(12, 1), barX(4)]]);
const ttY = chan(UI, barTop(2), [[T(12, 1), barTop(4)]]);
const knobP = chan(CURX, P0, [[T(13), P1]]);                     // same spring as the cursor, so the knob stays under it
const grab = pulse(UI, T(13), T(13, 2));
const tgl = chan(UI, 0, [[T(14), 1]]);
const tglPress = pulse(UI, T(14), T(14, 1));
const donePress = pulse(UI, T(15), T(15, 1));

const ROWS = {
  A: { nm: 'Research agent', st: 'Working · 2 min ago', on: true, bar: 0.64 },
  B: { nm: 'WhatsApp bot', st: 'Silent · no report', dash: true, bar: 0 },
  C: { nm: 'Support agent', st: 'Asleep · 5 h ago', bar: 0.31 }
};

/* ================= DOM ================= */
const $ = id => document.getElementById(id);
const rowEl = {};
for (const k of Object.keys(ROWS)) {
  const r = ROWS[k], d = document.createElement('div');
  d.className = 'row';
  d.innerHTML = `<div class="dot${r.on ? ' on' : ''}${r.dash ? ' dash' : ''}"></div><div class="nm">${r.nm}</div><div class="st">${r.st}</div><div class="bar"><i style="width:${r.bar * 100}%"></i></div>`;
  $('rows').appendChild(d); rowEl[k] = d;
}
const card = document.createElement('div');
card.className = 'row';
card.innerHTML = `
  <div class="hd" id="hd"><div class="dot" id="dDot"></div><div class="nm">Outreach agent</div>
    <div class="st sw"><div class="strip" id="dStrip"><div>Idle · just now</div><div>Needs you · approve batch</div></div></div>
    <div class="bar"><i style="width:82%"></i></div><div class="bang" id="dBang">!</div></div>
  <div class="cap" style="left:32px;top:140px">Signal · replies per day</div>
  <div class="base"></div>
  ${VAL.map((_, i) => `<div class="b" id="b${i}" style="left:${BAR.x0 + BAR.pitch * i}px"></div><div class="dl" style="left:${BAR.x0 + BAR.pitch * i}px;top:460px">${DAY[i]}</div>`).join('')}
  <div class="tt" id="tt"></div>
  <div class="cap" style="left:32px;top:500px">Settings</div>
  <div class="lab" style="top:536px">Report every</div>
  <div class="trk"></div><div class="fill" id="fill"></div><div class="knob" id="knob"></div><div class="val" id="val"></div>
  <div class="lab" style="top:650px">Notify me</div>
  <div class="tgl" id="tgl"><i id="tglK"></i></div>
  <div class="btn" id="done" style="left:896px;top:640px;width:180px">Done</div>`;
$('rows').appendChild(card);

const NOTE = 'Approve batch', TYPE_CPS = 40;
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const mix = (p) => `color-mix(in srgb, #D97757 ${Math.round(100 * clamp(p))}%, #ffffff)`;
const mixInk = (p) => `color-mix(in srgb, #D97757 ${Math.round(100 * clamp(p))}%, #0b0b0b)`;

function renderAt(t) {
  t = ((t % LOOP) + LOOP) % LOOP;
  /* camera */
  const s = camS(t), fx = camX(t), fy = camY(t);
  $('cam').style.transform = `translate(${720 - s * fx}px, ${720 - s * fy}px) scale(${s})`;

  /* Connect: hover lift, squash, label slides out as a loader ring slides in, ring closes, check draws */
  const m = morph(t), h = hover(t), bp = btnPress(t), ck = check(t), mc = clamp(m, 0, 1.1);
  const w = lerp(260, 68, clamp(m)), btn = $('btn');
  btn.style.left = (900 + (260 - w) / 2) + 'px'; btn.style.width = w + 'px';
  btn.style.transform = `translateY(${-6 * h}px) scale(${1 - 0.06 * bp})`;
  btn.style.background = mixInk(Math.max(h * (1 - clamp(m)), ck));
  $('lbl').style.transform = `translateY(${-76 * mc}px)`;
  $('ldr').style.transform = `translateY(${76 * (1 - mc)}px)`;
  const ring = $('ring'), ckc = clamp(ck);
  ring.setAttribute('transform', `rotate(${(t - T(4)) * 720} 22 22)`);
  ring.setAttribute('stroke-dasharray', `${80 + 26.8 * ckc} ${26.8 * (1 - ckc)}`);
  $('chk').setAttribute('stroke-dashoffset', 40 * (1 - ckc));

  /* list */
  const a = dRise(t), e = dExit(t), n = needs(t), x = Math.max(0, expand(t));
  for (const k of ['A', 'B', 'C']) rowEl[k].style.top = slotTop(slot[k](t)) + 'px';
  const rp = rowPress(t), sd = slot.D(t);
  card.style.top = lerp(slotTop(sd), 140, x) + 'px';
  card.style.height = lerp(112, 740, x) + 'px';
  card.style.transform = `translate(${e * 1200}px, ${(1 - a) * 480}px) scale(${1 - 0.02 * rp})`;
  $('hd').style.background = mix(n);
  $('dDot').style.background = mix(n);
  $('dStrip').style.transform = `translateY(${-24 * n}px)`;
  const bang = $('dBang'); bang.style.transform = `scale(${clamp(n, 0, 1.3)})`; bang.style.visibility = n > 0.01 ? 'visible' : 'hidden';
  $('foot').style.transform = `translateY(${-24 * (f1(t) + f2(t))}px)`;

  /* panel, chip, typed note */
  $('panel').style.transform = `translateX(${(1 - panelOpen(t)) * 640}px)`;
  const chip = $('chipN'), cp = chipPress(t);
  chip.style.background = mix(n); chip.style.transform = `scale(${1 - 0.06 * cp})`;
  $('xbtn').style.transform = `scale(${1 - 0.1 * closePress(t)})`;
  const typed = Math.floor(clamp((t - T(8)) * TYPE_CPS, 0, NOTE.length));
  const typing = typed > 0 && typed < NOTE.length, blink = Math.floor(Math.max(0, t - T(7, 2)) / 0.25) % 2 === 0;
  $('note').innerHTML = NOTE.slice(0, typed) + (t >= T(7, 2) && t < T(10) && (typing || blink) ? '<span class="caret"></span>' : '');

  /* detail card: bars spring up from the baseline, tooltip hops bar to bar, slider, toggle */
  for (let i = 0; i < VAL.length; i++) {
    const hgt = Math.max(0, BAR.max * VAL[i] * barR[i](t)), el = $('b' + i);
    el.style.height = hgt + 'px'; el.style.top = (BAR.base - hgt) + 'px';
    el.style.background = barHot[i] ? mixInk(barHot[i](t)) : '#0b0b0b';
  }
  const ts = ttShow(t), tx = ttX(t), idx = clamp(Math.round((tx - barX(0)) / BAR.pitch), 0, 6), tt = $('tt');
  tt.textContent = `${DAY[idx]} · ${Math.round(VAL[idx] * 50)} replies`;
  const ttw = tt.offsetWidth;
  tt.style.left = (tx - CARD.x - ttw / 2) + 'px'; tt.style.top = (ttY(t) - CARD.y - 16 - 56) + 'px';
  tt.style.transform = `scale(${Math.max(0, ts)})`; tt.style.visibility = ts > 0.01 ? 'visible' : 'hidden';
