<title>Agent Workshop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&family=Press+Start+2P&display=swap">
<style>
/* Layout concept: a handheld-game screen. Title bar, a typed dialog box that narrates the room, then the room itself:
   a tiled floor with one pixel-art bay per agent, a separate corner for agents that run on their own servers,
   and a storage box for finished sessions. Sprites are drawn on small canvases and scaled by whole numbers. */
:root {
  --ink: #1c1c28;
  --text: #202030;
  --text-2: #565870;
  --screen: #c9e0bd;
  --panel: #f8f8f0;
  --panel-2: #e6e2d0;
  --edge: #383848;
  --shadow: #9c9888;
  --wall: #eadcb8;
  --wall-2: #dccda4;
  --trim: #c25a42;
  --trim-2: #8e3c2c;
  --floor-a: #dccaa0;
  --floor-b: #d2bf92;
  --hp-g: #3cbc4c;
  --hp-y: #f0c020;
  --hp-r: #e04030;
  --hp-bg: #3c3c48;
  --c-working: #f0a818;
  --c-needs: #e04830;
  --c-review: #38a860;
  --c-failed: #a83858;
  --c-rest: #8890a8;
  --c-silent: #9a9aa8;
  --btn: #f0d848;
  --btn-text: #202030;
  --f-px: "Press Start 2P", "Courier New", monospace;
  --f-body: "Pixelify Sans", "Trebuchet MS", system-ui, sans-serif;
  --s: 4;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --text: #eef0ff; --text-2: #a8b0d8; --screen: #121630; --panel: #1f2440; --panel-2: #2a3052; --edge: #dfe4ff; --shadow: #070914;
    --wall: #2c3358; --wall-2: #242a4a; --trim: #8a3a60; --trim-2: #5e2640; --floor-a: #383e68; --floor-b: #323760; --hp-bg: #0e1020;
    --c-rest: #9aa2c8; --c-silent: #8a90b0;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --text: #eef0ff; --text-2: #a8b0d8; --screen: #121630; --panel: #1f2440; --panel-2: #2a3052; --edge: #dfe4ff; --shadow: #070914;
  --wall: #2c3358; --wall-2: #242a4a; --trim: #8a3a60; --trim-2: #5e2640; --floor-a: #383e68; --floor-b: #323760; --hp-bg: #0e1020;
  --c-rest: #9aa2c8; --c-silent: #8a90b0;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body {
  margin: 0; background: var(--screen); color: var(--text); font: 500 17px/1.35 var(--f-body);
  background-image: radial-gradient(var(--panel-2) 1px, transparent 1.5px); background-size: 16px 16px;
}
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 3px dashed var(--c-working); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.game { max-width: 1120px; margin: 0 auto; padding: 20px 16px 48px; display: grid; gap: 16px; }
.pbox { background: var(--panel); border: 4px solid var(--edge); box-shadow: inset 0 0 0 3px var(--panel-2), 4px 4px 0 0 var(--shadow); border-radius: 0; }

/* ---------- title ---------- */
.titlebar { display: flex; flex-wrap: wrap; gap: 14px 24px; align-items: center; justify-content: space-between; }
h1 { margin: 0; font: 400 clamp(18px, 4.6vw, 32px)/1.3 var(--f-px); text-transform: uppercase; color: var(--text); text-shadow: 3px 3px 0 var(--c-working); }
.party { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px; }
.party li { display: flex; align-items: center; gap: 8px; padding: 6px 8px; font: 400 9px/1 var(--f-px); text-transform: uppercase; }
.party li b { font-weight: 400; font-size: 14px; min-width: 1.1em; text-align: right; }
.party li[data-zero="1"] { opacity: .45; }
.gem { width: 12px; height: 12px; background: var(--c-rest); border: 2px solid var(--ink); flex: none; display: inline-block; }
.gem.working { background: var(--c-working); } .gem.needs { background: var(--c-needs); } .gem.review { background: var(--c-review); }
.gem.failed { background: var(--c-failed); } .gem.rest { background: var(--c-rest); } .gem.silent, .gem.archived { background: var(--c-silent); }

/* ---------- dialog ---------- */
.dialog { padding: 16px 40px 16px 18px; min-height: 84px; position: relative; display: flex; align-items: center; }
.dialog p { margin: 0; font: 500 clamp(17px, 2.6vw, 21px)/1.4 var(--f-body); max-width: 70ch; min-height: 2.8em; }
.arrow { position: absolute; right: 16px; bottom: 10px; font: 400 12px var(--f-px); animation: blink 1s steps(2) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; font: 400 9px/1.4 var(--f-px); text-transform: uppercase; color: var(--text-2); }
.btn {
  appearance: none; cursor: pointer; padding: 9px 12px; background: var(--btn); color: var(--btn-text); border: 3px solid var(--ink);
  box-shadow: 3px 3px 0 var(--ink); font: 400 9px/1 var(--f-px); text-transform: uppercase; text-decoration: none; display: inline-block;
}
.btn:hover { transform: translate(-1px, -1px); box-shadow: 4px 4px 0 var(--ink); }
.btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
.btn.ghost { background: var(--panel); color: var(--text); }

/* ---------- room ---------- */
.room { overflow: hidden; padding: 0; }
.walltop {
  background:
    linear-gradient(var(--trim) 0 8px, var(--trim-2) 8px 12px, transparent 12px) 0 100% / 100% 12px no-repeat,
    repeating-linear-gradient(90deg, transparent 0 30px, color-mix(in srgb, var(--wall-2) 80%, transparent) 30px 32px),
    var(--wall);
  padding: 22px 20px 30px; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 20px; align-items: start;
}
.clock { width: 104px; height: 104px; flex: none; shape-rendering: crispEdges; }
.clock .rim { fill: var(--panel); stroke: var(--ink); stroke-width: 6; }
.clock .tk { stroke: var(--ink); stroke-width: 3; }
.clock .hd { stroke: var(--ink); stroke-linecap: square; transform-origin: 50px 50px; }
.clock .sec { stroke: var(--c-needs); }
.board { background: var(--panel); border: 4px solid var(--edge); padding: 10px 12px 12px; box-shadow: 4px 4px 0 var(--shadow); min-width: 0; }
.board h2 { margin: 0 0 8px; font: 400 10px/1.4 var(--f-px); text-transform: uppercase; }
.board p { margin: 0; color: var(--text-2); max-width: 46ch; }
.notes { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.note { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 2px 8px; align-items: center; padding: 6px 8px; background: var(--panel-2); border: 2px solid var(--edge); }
.note .rn { overflow-wrap: anywhere; font-weight: 600; }
.note .sub { grid-column: 2 / -1; font-size: 14px; color: var(--text-2); overflow-wrap: anywhere; }
.note .nx { font: 400 8px/1.2 var(--f-px); text-transform: uppercase; color: var(--text-2); }
.floor {
  background: conic-gradient(var(--floor-a) 25%, var(--floor-b) 0 50%, var(--floor-a) 0 75%, var(--floor-b) 0) 0 0 / 64px 64px;
  padding: 24px 20px 28px; display: grid; gap: 26px;
}
.area { margin: 0 0 14px; font: 400 11px/1.4 var(--f-px); text-transform: uppercase; display: inline-block; padding: 8px 10px; }
.area small { font: 500 14px var(--f-body); text-transform: none; color: var(--text-2); margin-left: 8px; }
.bays { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, calc(var(--s) * 56px + 8px)), 1fr)); gap: 24px 16px; justify-items: center; }
.bays > li { width: calc(var(--s) * 56px); max-width: 100%; }
.bay { appearance: none; background: none; border: 0; padding: 0; width: 100%; cursor: pointer; text-align: left; display: block; color: inherit; }
.cv { display: block; width: calc(var(--s) * 56px); height: calc(var(--s) * 48px); image-rendering: pixelated; max-width: 100%; }
.plate { display: grid; gap: 6px; padding: 8px 9px 9px; margin-top: 2px; }
.bay:hover .plate, .bay:focus-visible .plate { border-color: var(--c-working); }
.nm { font: 400 10px/1.5 var(--f-px); text-transform: uppercase; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; }
.tag { display: inline-block; padding: 3px 5px 2px; font: 400 8px/1.2 var(--f-px); text-transform: uppercase; color: #fff; background: var(--c-rest); border: 2px solid var(--ink); }
.tag.working { background: var(--c-working); color: var(--ink); } .tag.needs { background: var(--c-needs); } .tag.review { background: var(--c-review); }
.tag.failed { background: var(--c-failed); } .tag.rest { background: var(--c-rest); } .tag.silent { background: var(--c-silent); color: var(--ink); } .tag.ex { background: var(--panel); color: var(--text); }
.ago { margin-left: auto; font-size: 14px; color: var(--text-2); }
.msg { font-size: 15px; line-height: 1.25; color: var(--text-2); overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.msg.hot { color: var(--c-needs); font-weight: 700; }
.hp { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px; align-items: center; }
.hp b { font: 400 8px/1 var(--f-px); }
.hp i { display: block; height: 10px; background: var(--hp-bg); border: 2px solid var(--ink); position: relative; }
.hp i::after { content: ""; position: absolute; inset: 0 auto 0 0; width: var(--w, 0%); background: var(--hp-g); }
.hp i.y::after { background: var(--hp-y); } .hp i.r::after { background: var(--hp-r); }
.empty .plate { opacity: .75; }
.banner { padding: 12px 14px; display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; border-left-width: 12px; border-left-color: var(--c-needs); }
.banner p { margin: 0; flex: 1 1 260px; min-width: 0; }
.field-empty { padding: 12px 14px; display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; margin-top: 12px; }
.field-empty p { margin: 0; flex: 1 1 260px; }
.add { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 16px; }
.add input, .add select, .sheet input, .sheet select { background: var(--panel); border: 3px solid var(--ink); padding: 7px 9px; min-width: 0; }

/* ---------- storage box ---------- */
.pc { padding: 14px 16px 18px; }
.pc h2 { margin: 0 0 12px; font: 400 11px/1.4 var(--f-px); text-transform: uppercase; }
.pc h2 small { font: 500 14px var(--f-body); text-transform: none; color: var(--text-2); margin-left: 8px; }
.slots { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 190px), 1fr)); gap: 10px; }
.slot { appearance: none; width: 100%; cursor: pointer; text-align: left; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 10px; align-items: center; padding: 8px; background: var(--panel-2); border: 3px solid var(--edge); color: inherit; }
.slot:hover { border-color: var(--c-working); }
.slot canvas { width: 40px; height: 36px; image-rendering: pixelated; grid-row: 1 / 3; }
.slot b { font: 400 8px/1.5 var(--f-px); text-transform: uppercase; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.slot span { font-size: 13px; color: var(--text-2); }
.more { margin-top: 12px; }

/* ---------- summary screen ---------- */
.veil { position: fixed; inset: 0; z-index: 30; background: rgba(10, 12, 24, .62); display: flex; align-items: center; justify-content: center; padding: 16px; overflow: auto; }
.sheet { width: min(100%, 560px); max-height: 100%; overflow: auto; padding: 14px 16px 18px; background: var(--panel); }
.sheet-top { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 14px; align-items: center; }
.sheet-top canvas { width: calc(3 * 56px); height: calc(3 * 48px); image-rendering: pixelated; max-width: 100%; background: conic-gradient(var(--floor-a) 25%, var(--floor-b) 0 50%, var(--floor-a) 0 75%, var(--floor-b) 0) 0 0 / 32px 32px; border: 4px solid var(--edge); }
.sheet h3 { margin: 6px 0 0; font: 400 13px/1.6 var(--f-px); text-transform: uppercase; overflow-wrap: anywhere; }
.sheet-msg { margin: 14px 0 0; padding: 12px 14px; min-height: 4.2em; background: var(--panel-2); border: 3px solid var(--edge); font-size: 18px; line-height: 1.4; }
.sheet-msg.hot { border-color: var(--c-needs); }
.stats { margin: 14px 0 0; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px 14px; }
.stats dt { font: 400 8px/1.9 var(--f-px); text-transform: uppercase; color: var(--text-2); }
.stats dd { margin: 0; overflow-wrap: anywhere; font-size: 16px; }
.menu { margin: 14px 0 0; display: grid; gap: 4px; padding: 8px; background: var(--panel-2); border: 3px solid var(--edge); }
.menu h4 { margin: 0 0 4px; font: 400 8px/1.5 var(--f-px); text-transform: uppercase; color: var(--text-2); }
.opt { appearance: none; background: none; border: 0; text-align: left; cursor: pointer; padding: 7px 8px 7px 24px; font: 400 10px/1.3 var(--f-px); text-transform: uppercase; position: relative; }
.opt::before { content: "\25B6"; position: absolute; left: 6px; top: 8px; font-size: 9px; opacity: 0; }
.opt:hover::before, .opt:focus-visible::before { opacity: 1; }
.opt[aria-pressed="true"] { background: var(--panel); }
.opt[aria-pressed="true"]::before { opacity: 1; }
.fields { display: grid; gap: 8px; margin: 12px 0 0; }
.fields label { display: grid; gap: 4px; font: 400 8px/1.5 var(--f-px); text-transform: uppercase; color: var(--text-2); }
.fields .line { display: flex; gap: 8px; }
.fields input { flex: 1; font: 500 16px var(--f-body); }
.sheet .acts { margin-top: 16px; display: flex; gap: 10px; flex-wrap: wrap; }

@media (max-width: 560px) {
  :root { --s: 3; }
  .walltop { grid-template-columns: minmax(0, 1fr); }
  .clock { width: 80px; height: 80px; }
  .sheet-top { grid-template-columns: minmax(0, 1fr) auto; }
  .sheet-top canvas { grid-column: 1 / -1; grid-row: 2; justify-self: center; }
}
@media (prefers-reduced-motion: reduce) { .arrow { animation: none; } .btn { transition: none; } }
</style>

<div class="game">
  <header class="titlebar">
    <h1>Agent Workshop</h1>
    <ul class="party" id="tally" aria-label="Agents by status"></ul>
  </header>

  <section class="dialog pbox" aria-label="Workshop report">
    <p id="headline" aria-hidden="true"></p>
    <p class="sr" id="headlineSr" aria-live="polite"></p>
    <span class="arrow" aria-hidden="true">&#9660;</span>
  </section>

  <div class="toolbar"><span id="fresh">Waiting for the first report</span><button class="btn ghost" id="refresh" type="button">Refresh</button></div>

  <main class="room pbox">
    <div class="walltop">
      <svg class="clock" viewBox="0 0 100 100" aria-hidden="true" focusable="false">
        <rect class="rim" x="6" y="6" width="88" height="88" rx="14"/>
        <g id="ticks"></g>
        <line class="hd" id="hh" x1="50" y1="50" x2="50" y2="29" stroke-width="7"/>
        <line class="hd" id="mh" x1="50" y1="50" x2="50" y2="18" stroke-width="5"/>
        <line class="hd sec" id="sh" x1="50" y1="56" x2="50" y2="16" stroke-width="2.5"/>
        <rect x="46" y="46" width="8" height="8" fill="var(--ink)"/>
      </svg>
      <section class="board" aria-labelledby="bbh"><h2 id="bbh">Bulletin board</h2><div id="routines"><p>Checking for scheduled routines.</p></div></section>
    </div>
    <div class="floor">
      <div id="banner"></div>
      <section aria-labelledby="fl1">
        <h2 class="area pbox" id="fl1">Workshop floor <small>Claude Code agents</small></h2>
        <ul class="bays" id="bays"></ul>
      </section>
      <section aria-labelledby="fl2">
        <h2 class="area pbox" id="fl2">Field agents <small>run on their own servers and report in here</small></h2>
        <ul class="bays" id="field"></ul>
        <div id="fieldMsg"></div>
        <form class="add" id="addForm" hidden>
          <input id="addName" type="text" maxlength="40" placeholder="Name a new field agent" aria-label="Name of a new field agent" required>
          <select id="addKind" aria-label="Kind of agent"><option value="whatsapp">WhatsApp</option><option value="outreach">Outreach</option><option value="other">Other</option></select>
          <button class="btn" type="submit">Add</button>
        </form>
      </section>
    </div>
  </main>

  <section class="pc pbox" id="pcWrap" hidden>
    <h2>Storage box <small id="pcCount"></small></h2>
    <ul class="slots" id="slots"></ul>
    <button class="btn ghost more" id="pcMore" type="button" hidden>Show all</button>
  </section>
</div>

<div class="veil" id="veil" hidden><aside class="sheet pbox" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"></aside></div>

<script>
(function () {
  'use strict';
  var SERVER = 'Claude Code Remote';
  var S = { unsub: [], sessions: null, routines: null, err: null, rErr: null, fetchedAt: null, mode: 'loading', selected: null, shelfAll: false, mcp: null, sig: '',
            db: null, field: null, dbErr: null, byId: {}, frame: 0, busy: {}, headText: '' };
  var LABEL = { working: 'Working', needs: 'Needs you', review: 'Done', failed: 'Fainted', rest: 'Asleep', silent: 'Silent', archived: 'Boxed' };
  var RANK = { needs: 0, working: 1, failed: 2, review: 3, rest: 4, silent: 5 };
  var ORIGIN = { desktop_app: 'Desktop app', claude_code_cli: 'Terminal', web: 'Web', mobile: 'Phone' };
  var REDUCE = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);

  function $(id) { return document.getElementById(id); }
  function esc(v) { return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function plural(n, one, many) { return n + ' ' + (n === 1 ? one : many); }
  function ago(ms) {
    if (!ms) return '';
    var s = Math.max(0, Math.round((Date.now() - ms) / 1000));
    if (s < 45) return 'just now';
    var m = Math.round(s / 60); if (m < 60) return m + ' min ago';
    var h = Math.round(m / 60); if (h < 36) return h + ' h ago';
    return Math.round(h / 24) + ' d ago';
  }
  function until(ms) {
    var s = Math.round((ms - Date.now()) / 1000);
    if (s < 60) return 'any moment';
    var m = Math.round(s / 60); if (m < 60) return 'in ' + m + ' min';
    var h = Math.round(m / 60); if (h < 36) return 'in ' + h + ' h';
    return 'in ' + Math.round(h / 24) + ' d';
  }
  function when(ms) { try { return new Date(ms).toLocaleString([], { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }); } catch (e) { return ''; } }
  function hash(s) { var h = 0; for (var i = 0; i < s.length; i++) { h = (h * 31 + s.charCodeAt(i)) >>> 0; } return h; }
  function pick(o, path) { for (var i = 0; i < path.length && o != null; i++) o = o[path[i]]; return o; }

  /* =================== pixel art =================== */
  var W = 56, H = 48;
  var HUES = [['#58a8d0', '#3878a0', '#98d0e8'], ['#9878d0', '#6850a0', '#c0a8e8'], ['#e078a0', '#a85078', '#f0a8c8'],
              ['#58b878', '#388850', '#98e0a8'], ['#d8a840', '#a07820', '#f0d078'], ['#e08858', '#b05830', '#f0b088']];
  var STC = { working: '#f0b020', needs: '#e84830', review: '#40b868', failed: '#a83858', rest: '#8890a8', silent: '#8890a8' };
  var PAL = {
    light: { ink: '#1c1c28', shadow: 'rgba(28,28,40,.22)', top: '#cc9c5c', topL: '#e2b878', front: '#a87440', dark: '#6e4824', leg: '#80582c', screen: '#18202a', eye: '#f8f8f0', skin: '#f8e8c8', steel: '#9aa4ac', wood: '#9a7040', lamp: '#4a5560', off: '#707880', paper: '#f8f8f0', line: '#9098a8' },
    dark: { ink: '#0c0e1a', shadow: 'rgba(0,0,0,.35)', top: '#8a6638', topL: '#a08048', front: '#684a2c', dark: '#3c2a18', leg: '#503820', screen: '#10161e', eye: '#f8f8f0', skin: '#e8d8b8', steel: '#8a949c', wood: '#8a6438', lamp: '#3a4450', off: '#606870', paper: '#e8e8e0', line: '#8088a0' }
  };
  function isDark() {
    var t = document.documentElement.getAttribute('data-theme');
    if (t) return t === 'dark';
    return !!(window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
  }
  var GLYPH = { Z: ['11111', '00010', '00100', '01000', '11111'], Q: ['01110', '10001', '00010', '00100', '00000', '00100'] };

  function drawBay(cv, a, f) {
    var ctx = cv.getContext('2d'); ctx.imageSmoothingEnabled = false;
    ctx.clearRect(0, 0, W, H);
    var P = isDark() ? PAL.dark : PAL.light, ink = P.ink;
    function R(x, y, w, h, c) { ctx.fillStyle = c; ctx.fillRect(x, y, w, h); }

    var all = (code || []).concat(field || []).filter(function (a) { return a.state !== 'archived'; });
    renderTally(code || field ? all : null);
    renderFresh();
    var wrap = $('pcWrap');
    wrap.hidden = !shelf.length;
    if (shelf.length) {
      var shown = S.shelfAll ? shelf : shelf.slice(0, 8);
      $('pcCount').textContent = plural(shelf.length, 'finished session', 'finished sessions');
      $('slots').innerHTML = shown.map(function (a) { return '<li><button class="slot" type="button" data-id="' + esc(a.id) + '"><canvas class="mini" width="20" height="18" data-id="' + esc(a.id) + '" aria-hidden="true"></canvas><b>' + esc(a.title) + '</b><span data-ago="' + a.updated + '">' + esc(ago(a.updated)) + '</span></button></li>'; }).join('');
      var more = $('pcMore'); more.hidden = shelf.length <= 8; more.textContent = S.shelfAll ? 'Show fewer' : 'Show all ' + shelf.length;
    }
    redraw();
    if (S.selected) renderSheet(false);
  }
  function renderRoutines() {
    var el = $('routines'), list = S.routines;
    if (!list) { el.innerHTML = '<p>' + (S.rErr && S.mode !== 'example' ? 'Could not read routines right now.' : 'Checking for scheduled routines.') + '</p>'; return; }
    if (!list.length) { el.innerHTML = '<p>Nothing is pinned here. A scheduled routine shows up as a note on this board.</p>'; return; }
    el.innerHTML = '<ul class="notes">' + list.slice(0, 6).map(function (r) {
      var last = pick(r, ['last_run', 'status']);
      var g = r.enabled === false ? 'rest' : (String(last || '').toUpperCase().indexOf('FAIL') >= 0 ? 'failed' : last ? 'review' : 'working');
      var sched = r.run_once_at ? 'Once, ' + when(Date.parse(r.run_once_at)) : (r.cron_expression || 'Manual trigger');
      var nx = r.enabled === false ? 'Paused' : (r.next_run_at ? until(Date.parse(r.next_run_at)) : '');
      return '<li class="note"><i class="gem ' + g + '"></i><span class="rn">' + esc(r.name || 'Untitled routine') + '</span><span class="nx">' + esc(nx) + '</span><span class="sub">' + esc(sched) + '</span></li>';
    }).join('') + '</ul>' + (list.length > 6 ? '<p style="margin-top:8px">and ' + (list.length - 6) + ' more</p>' : '');
  }

  /* =================== summary screen =================== */
  var STATES = [['working', 'Working on something'], ['needs', 'Needs me'], ['review', 'Done, I should look'], ['rest', 'Idle, all fine'], ['failed', 'Broken']];
  function renderSheet(fresh) {
    var a = S.byId[S.selected], sh = $('sheet'), veil = $('veil');
    if (!a) { veil.hidden = true; S.selected = null; return; }
    var typing = document.activeElement && sh.contains(document.activeElement) && /INPUT|SELECT/.test(document.activeElement.tagName);
    if (typing && !fresh) return;                       /* do not rebuild under someone who is typing */
    var facts = [];
    function add(k, v) { if (v) facts.push('<dt>' + k + '</dt><dd>' + esc(v) + '</dd>'); }
    add('Last active', a.updated ? ago(a.updated) + ', ' + when(a.updated) : (a.field ? 'Never reported' : ''));
    add('Started', a.created ? when(a.created) : '');
    add('Working in', a.repo); add('Branch', a.branch); add('Model', a.model); add('Runs on', a.origin);
    add('Context', a.ctx == null ? '' : (100 - a.ctx) + '% left of the window');
    add('Reports every', a.field ? ttlText(a.ttl) : '');
    add('Last set by', a.field && a.by ? (a.by === 'page' ? 'you, on this page' : a.by) : '');
    add('Connection', a.connected ? '' : 'Disconnected from its machine');
    var menu = '';
    if (a.field) {
      menu = '<div class="menu" role="group" aria-label="Report its status"><h4>Report status</h4>' + STATES.map(function (o) { return '<button class="opt" type="button" data-set="' + o[0] + '" aria-pressed="' + (a.reported === o[0] && a.state !== 'silent' ? 'true' : 'false') + '">' + o[1] + '</button>'; }).join('') + '</div>' +
        '<div class="fields"><label for="fnote">Note<span class="line"><input id="fnote" type="text" maxlength="140" value="' + esc(a.note) + '" placeholder="What is it doing?"><button class="btn" type="button" id="fnoteSave">Save</button></span></label>' +
        '<label for="fttl">Should report every<select id="fttl">' + [[60, '1 hour'], [360, '6 hours'], [1440, '1 day'], [4320, '3 days']].map(function (o) { return '<option value="' + o[0] + '"' + (a.ttl === o[0] ? ' selected' : '') + '>' + o[1] + '</option>'; }).join('') + '</select></label></div>';
    }
    var hp = '';
    if (a.ctx != null) hp = '<div class="hp" style="margin-top:12px" title="Context left in the window"><b>HP</b><i class="' + hpClass(100 - a.ctx) + '" style="--w:' + (100 - a.ctx) + '%"></i></div>';
    if (a.field) hp = '<div class="hp" style="margin-top:12px" title="How fresh its last report is"><b>SIG</b><i class="' + hpClass(a.signal) + '" style="--w:' + a.signal + '%"></i></div>';
    sh.innerHTML = '<div class="sheet-top"><canvas id="sheetCv" width="' + W + '" height="' + H + '" aria-hidden="true"></canvas><div><span class="tag ' + a.state + '">' + LABEL[a.state] + '</span><h3 id="sheetTitle">' + esc(a.title) + '</h3></div><button class="btn ghost" id="closeSheet" type="button">Back</button></div>' +
      '<p class="sheet-msg' + (a.state === 'needs' ? ' hot' : '') + '" id="sheetMsg"></p>' + hp + '<dl class="stats">' + facts.join('') + '</dl>' + menu +
      (a.url ? '<div class="acts"><a class="btn" href="' + esc(a.url) + '" target="_blank" rel="noopener">Open session</a></div>' : '');
    var opened = veil.hidden; veil.hidden = false;
    if (opened || fresh) { typeText($('sheetMsg'), sayFor(a), 'sheet'); $('closeSheet').focus(); } else { $('sheetMsg').textContent = sayFor(a); }
    redraw();
  }
  function openSheet(id, opener) { S.selected = id; S.opener = opener || null; renderSheet(true); }
  function closeSheet() { S.selected = null; $('veil').hidden = true; if (typer.sheet) clearInterval(typer.sheet); if (S.opener && document.contains(S.opener)) S.opener.focus(); }

  /* =================== clock =================== */
  function buildTicks() {
    var g = '';
    for (var i = 0; i < 12; i++) { var a = i * Math.PI / 6, r1 = i % 3 ? 37 : 33, r2 = 41; g += '<line class="tk" x1="' + (50 + r1 * Math.sin(a)).toFixed(1) + '" y1="' + (50 - r1 * Math.cos(a)).toFixed(1) + '" x2="' + (50 + r2 * Math.sin(a)).toFixed(1) + '" y2="' + (50 - r2 * Math.cos(a)).toFixed(1) + '"/>'; }
    $('ticks').innerHTML = g;
  }
  function tick() {
    var d = new Date(), s = d.getSeconds(), m = d.getMinutes() + s / 60, h = (d.getHours() % 12) + m / 60;
    $('hh').style.transform = 'rotate(' + Math.round(h * 30) + 'deg)';
    $('mh').style.transform = 'rotate(' + Math.round(m * 6) + 'deg)';
    $('sh').style.transform = 'rotate(' + (s * 6) + 'deg)';
    document.querySelectorAll('[data-ago]').forEach(function (el) { el.textContent = ago(+el.getAttribute('data-ago')); });
    renderFresh();
  }

  /* =================== connectors and database =================== */
  function onSessions(ev) {
    if (ev.type === 'error') {
      S.err = ev.error;
      var denied = ['needs_reauth', 'server_not_connected', 'not_in_manifest', 'blocked_by_policy', 'approval_required', 'consent_required', 'selection_required', 'not_granted', 'capability_disabled'].indexOf(ev.error && ev.error.code) >= 0;
      if (denied) { S.sessions = null; S.mode = 'example'; } else if (!S.sessions) { S.mode = 'example'; }
      render(); return;
    }
    var res = ev.result || {}, list = extractList(res.payload != null ? res.payload : res);
    if (!list) { S.err = { code: 'shape' }; if (!S.sessions) S.mode = 'example'; render(); return; }
    S.err = null; S.mode = 'live'; S.sessions = list; S.fetchedAt = (res.cache && res.cache.storedAt) || Date.now();
    var sig = JSON.stringify(list.map(function (s) { return [s.id, s.status_bucket, s.session_status, s.title, s.updated_at, s.connection_status]; }));
    if (sig !== S.sig) { S.sig = sig; render(); } else { renderFresh(); $('banner').innerHTML = bannerHtml(); }
  }
  function onRoutines(ev) {
    if (ev.type === 'error') { S.rErr = ev.error; renderRoutines(); return; }
    var res = ev.result || {}, list = extractList(res.payload != null ? res.payload : res);
    S.rErr = null; S.routines = list || []; renderRoutines();
  }
  function startMcp(mcp) {
    S.mcp = mcp;
    try { S.unsub.push(mcp.watchTool(SERVER, 'list_sessions', { limit: 50 }, onSessions, { refetchInterval: 30000 })); } catch (e) { onSessions({ type: 'error', error: { code: 'bad_request', message: String(e) } }); }
    try { S.unsub.push(mcp.watchTool(SERVER, 'list_triggers', { limit: 50 }, onRoutines, { refetchInterval: 60000 })); } catch (e) { /* routines are optional */ }
  }
  function startDb(db) {
    S.db = db;
    try {
      db.collection('agents').onSnapshot(function (snap) {
        S.field = snap.docs.map(function (d) { var x = Object.assign({}, d.data() || {}); x.id = d.id; return x; });
        render();
      }, function (e) { S.dbErr = e; S.field = S.field || []; render(); });
    } catch (e) { S.dbErr = e; S.field = []; render(); }
  }
  function saveField(id, patch) {
    if (!S.db || !id || S.busy[id]) return;
    S.busy[id] = true;
    S.db.doc('agents/' + id).update(patch).catch(function () { $('fresh').textContent = 'Could not save. You may only have view access to this page.'; })
      .then(function () { S.busy[id] = false; });
  }
  function refresh() {
    if (!S.mcp) return;
    $('fresh').textContent = 'Asking for a fresh report';
    S.mcp.invalidate(SERVER, 'list_sessions').catch(function () {}); S.mcp.invalidate(SERVER, 'list_triggers').catch(function () {});
  }
  function allow() {
    if (!S.mcp) return;
    S.mcp.callTool(SERVER, 'list_sessions', { limit: 50 }, { cache: false }).then(function (r) { S.unsub.forEach(function (f) { try { f(); } catch (e) {} }); S.unsub = []; onSessions({ type: 'data', result: r }); startMcp(S.mcp); })
      .catch(function (e) { S.err = e; render(); });
  }

  /* =================== events =================== */
  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-id], [data-set], #refresh, #closeSheet, #retry, #allow, #pcMore, #fnoteSave, #veil');
    if (!t) return;
    if (t.id === 'veil') { if (e.target === t) closeSheet(); return; }
    if (t.id === 'refresh' || t.id === 'retry') { refresh(); return; }
    if (t.id === 'allow') { allow(); return; }
    if (t.id === 'closeSheet') { closeSheet(); return; }
    if (t.id === 'pcMore') { S.shelfAll = !S.shelfAll; render(); return; }
    if (t.id === 'fnoteSave') { saveField(S.selected, { note: $('fnote').value.trim(), reportedAt: Date.now(), by: 'page' }); return; }
    if (t.hasAttribute('data-set')) { saveField(S.selected, { state: t.getAttribute('data-set'), reportedAt: Date.now(), by: 'page' }); return; }
    if (t.hasAttribute('data-id') && t.getAttribute('data-id') !== '_') openSheet(t.getAttribute('data-id'), t);
  });
  document.addEventListener('change', function (e) { if (e.target.id === 'fttl') saveField(S.selected, { ttlMin: +e.target.value }); });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && S.selected) closeSheet();
    if (e.key === 'Enter' && e.target.id === 'fnote') { e.preventDefault(); $('fnoteSave').click(); }
  });
  $('addForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var name = $('addName').value.trim(); if (!name || !S.db) return;
    var kind = $('addKind').value;
    S.db.collection('agents').add({ name: name, kind: kind, state: 'rest', note: '', reportedAt: null, ttlMin: kind === 'outreach' ? 1440 : 360, order: 50, by: 'page' })
      .then(function () { $('addName').value = ''; }).catch(function () { $('fresh').textContent = 'Could not add it. You may only have view access to this page.'; });
  });

  buildTicks(); tick(); render(); renderRoutines();
  setInterval(tick, 1000);
  if (!REDUCE) setInterval(function () { S.frame ^= 1; redraw(); }, 420);
  if (window.matchMedia) { try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', redraw); } catch (e) {} }
  try { new MutationObserver(redraw).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] }); } catch (e) {}
  var cl = window.claude;
  if (!cl || !cl.use) { S.mode = 'example'; render(); renderRoutines(); }
  else {
    cl.use('mcp').then(function (mcp) { if (!mcp) { S.mode = 'example'; S.routines = []; render(); renderRoutines(); return; } startMcp(mcp); }).catch(function () { S.mode = 'example'; render(); });
    cl.use('db').then(function (db) { if (db) startDb(db); else render(); }).catch(function () { render(); });
  }
})();
</script>
